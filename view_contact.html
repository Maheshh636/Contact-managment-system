<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Contact</title>
    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/view_contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    </head>
    <body>
    <header>
        <div class="title">Contact Management System</div>
        <nav class="navbar_container">
        <div class="navbar_item">
            <a href="index.html" class="nav_link"><i class="fa-solid fa-house"></i></a>
        </div>
        <!-- <div class="navbar_item">
            <a href="login.html" class="nav_link">Login</a>
        </div> -->
        </nav>
    </header>

    <main>
        <section class="view_contact_container">
        <div class="contact_card">
            <img src="./assets/pexels-viridianaor-31205502.jpg" alt="Contact Photo" class="contact_photo">
            <div class="contact_details">
            <h2 class="contact_name">Lisa</h2>
            <div class="tags_container">
                <span class="tags">Company</span>
                <span class="tags">Friend</span>
            </div>
            <div class="contact_info">
                <p><i class="fa-solid fa-envelope"></i> lisa@example.com</p>
                <p><i class="fa-solid fa-phone"></i> +1 234 567 890</p>
                
            </div>
            </div>
            <div class="action_buttons">
            <a href="edit_contact.html" class="btn edit_btn">Edit</a>
            <a href="index.html" class="btn back_btn">Back</a>
            </div>
        </div>
        </section>
    </main>
    </body>
    </html>
